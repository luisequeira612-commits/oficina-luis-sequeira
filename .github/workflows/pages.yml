name: Validate and deploy Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline application script")
          Path("/tmp/oficina-app.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/oficina-app.js
      - name: Check required page content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "<title>Oficina de Luis Sequeira</title>",
              "Simulación. En la versión real, los estados vendrán de GitHub.",
              "oficina-luis-sequeira-v1",
              "App Guardi", "Canal de YouTube", "Tema Nova Launcher",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required content: " + ", ".join(missing))
          PY

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
